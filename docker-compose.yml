services:
  app:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./logs:/app/logs
    env_file: .env
    ports:
      - "7080:7080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - asr-network

  celery-worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./logs:/app/logs
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - asr-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - asr-network

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://app:7080
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
    depends_on:
      - app
    networks:
      - asr-network

networks:
  asr-network:
    driver: bridge
